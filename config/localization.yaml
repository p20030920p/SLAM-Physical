amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    map_topic: map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    min_particles: 500
    max_particles: 2000
    max_beams: 90
    laser_min_range: 0.15
    laser_max_range: 12.0
    sigma_hit: 0.15
    z_hit: 0.9
    z_rand: 0.1
    update_min_d: 0.02
    update_min_a: 0.02
    transform_tolerance: 0.2
    tf_broadcast: true
    set_initial_pose: true
    initial_pose: {x: 6.25, y: 6.15, z: 0.0, yaw: 0.12}
    save_pose_rate: -1.0
map_server:
  ros__parameters:
    use_sim_time: true
    topic_name: map
    frame_id: map
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: [map_server, amcl]
    bond_timeout: 10.0
