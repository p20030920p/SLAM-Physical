[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slam-physical"
version = "0.1.0"
description = "Controlled historical-pose revision experiments with native BeautyMap"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "scipy>=1.10", "matplotlib>=3.6", "Pillow>=9", "PyYAML>=6"]

[project.scripts]
slam-physical = "slam_physical.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
